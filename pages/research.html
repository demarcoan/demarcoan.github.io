    <script>
        const navbar = document.querySelector(".navbar");
        const navbarToggle = document.querySelector(".navbar-toggle");

        const dropdownCV = document.querySelector(".dropdown-cv");
        const dropdownCVLink = document.querySelector(".dropdown-cv-link");

        const dropdownResearch = document.querySelector(".dropdown-research");
        const dropdownResearchLink = document.querySelector(".dropdown-research-link");

        navbarToggle.addEventListener("click", function () {
            navbar.classList.toggle("open");
        });

        dropdownCVLink.addEventListener("click", function (event) {
            if (window.innerWidth <= 700) {
                event.preventDefault();
                dropdownCV.classList.toggle("open");
                dropdownResearch.classList.remove("open");
            }
        });

        dropdownResearchLink.addEventListener("click", function (event) {
            if (window.innerWidth <= 700) {

                dropdownResearch.classList.toggle("open");
